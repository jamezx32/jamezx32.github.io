<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f675c"/>
    </marker>
  </defs>

  <!-- 阶段标题 -->
  <text x="60" y="34" font-size="17" fill="#211d19" font-weight="700">命名属性的三种存储形态（由快到慢，按需迁移）</text>

  <!-- 阶段1：in-object -->
  <g>
    <text x="60" y="76" font-size="14.5" fill="#a13c2a" font-weight="700">① in-object 槽位</text>
    <text x="60" y="97" font-size="13" fill="#6f675c">对象创建时预留在头部之后</text>
    <rect x="60" y="112" width="250" height="180" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="60" y="112" width="250" height="32" fill="#211d19"/>
    <text x="185" y="133" font-size="14.5" fill="#f4efe4" text-anchor="middle" font-weight="600">对象头（map …）</text>
    <line x1="66" y1="168" x2="304" y2="168" stroke="#d8d2c4"/>
    <line x1="66" y1="216" x2="304" y2="216" stroke="#d8d2c4"/>
    <g font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="80" y="194">slot0 : prop a</text>
      <text x="80" y="242">slot1 : prop b</text>
      <text x="80" y="280" fill="#6f675c">unused …</text>
    </g>
  </g>

  <path d="M 322 202 L 356 202" fill="none" stroke="#6f675c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="318" y="184" font-size="12.5" fill="#6f675c">槽位用尽</text>

  <!-- 阶段2：properties store -->
  <g>
    <text x="368" y="76" font-size="14.5" fill="#a13c2a" font-weight="700">② out-of-object 槽位</text>
    <text x="368" y="97" font-size="13" fill="#6f675c">对象指向独立的 properties store</text>
    <rect x="368" y="112" width="250" height="180" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="368" y="112" width="250" height="32" fill="#3f6f60"/>
    <text x="493" y="133" font-size="14.5" fill="#f4efe4" text-anchor="middle" font-weight="600">properties store</text>
    <line x1="374" y1="168" x2="612" y2="168" stroke="#d8d2c4"/>
    <line x1="374" y1="216" x2="612" y2="216" stroke="#d8d2c4"/>
    <line x1="374" y1="264" x2="612" y2="264" stroke="#d8d2c4"/>
    <g font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="388" y="194">slot0 : prop a</text>
      <text x="388" y="242">slot1 : prop b</text>
      <text x="388" y="280">slot2 : prop c</text>
    </g>
    <text x="493" y="316" font-size="12.5" fill="#6f675c" text-anchor="middle">对象的 properties 指针指到这里</text>
  </g>

  <path d="M 630 202 L 664 202" fill="none" stroke="#6f675c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="610" y="184" font-size="12.5" fill="#6f675c">形状频繁变化 / 删除属性</text>

  <!-- 阶段3：dictionary -->
  <g>
    <text x="676" y="76" font-size="14.5" fill="#a13c2a" font-weight="700">③ dictionary mode</text>
    <text x="676" y="97" font-size="13" fill="#6f675c">哈希表，牺牲速度换灵活</text>
    <rect x="676" y="112" width="250" height="180" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="676" y="112" width="250" height="32" fill="#6f675c"/>
    <text x="801" y="133" font-size="14.5" fill="#f4efe4" text-anchor="middle" font-weight="600">字典（hash 表）</text>
    <line x1="682" y1="168" x2="920" y2="168" stroke="#d8d2c4"/>
    <line x1="682" y1="216" x2="920" y2="216" stroke="#d8d2c4"/>
    <g font-size="14" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="696" y="194">hash | key | value | attrs</text>
      <text x="696" y="242">hash | key | value | attrs</text>
      <text x="696" y="280" fill="#6f675c">…（无固定槽位顺序）</text>
    </g>
  </g>

  <!-- 底部要点 -->
  <line x1="60" y1="336" x2="926" y2="336" stroke="#d8d2c4"/>
  <g font-size="13.5" fill="#211d19">
    <text x="60" y="368">· map（隐藏类）描述 ①② 的槽位布局：形状相同 → 槽位偏移相同 → 字段访问编译成固定偏移读写。</text>
    <text x="60" y="396">· 槽位迁移（①→②）只改指针和 map，不改已存数据；进入 ③ 后失去固定偏移，fast path 退化为查表。</text>
    <text x="60" y="424">· 漏洞分析视角：JIT 若按旧 map 的固定偏移访问已迁入字典的对象，读写就会落到错误位置 —— 典型 type confusion 来源。</text>
  </g>
</svg>
