<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#211d19"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6f60"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13c2a"/>
    </marker>
  </defs>

  <!-- 顶部代码示例 -->
  <g>
    <rect x="60" y="16" width="330" height="76" fill="#fbf9f4" stroke="#d8d2c4"/>
    <text x="80" y="44" font-size="15" fill="#211d19" font-weight="600" font-family="Menlo, Consolas, monospace">obj.a = 1</text>
    <text x="310" y="44" font-size="13.5" fill="#a13c2a">→ 命名属性</text>
    <text x="80" y="72" font-size="15" fill="#211d19" font-weight="600" font-family="Menlo, Consolas, monospace">obj[0] = 1</text>
    <text x="296" y="72" font-size="13.5" fill="#3f6f60">→ 整数索引</text>
  </g>
  <text x="430" y="46" font-size="15" fill="#6f675c">同一个 JSObject，</text>
  <text x="430" y="70" font-size="15" fill="#6f675c">两类数据走两条存储路径</text>

  <!-- 左：JSObject -->
  <g>
    <rect x="60" y="140" width="240" height="216" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="60" y="140" width="240" height="34" fill="#211d19"/>
    <text x="180" y="163" font-size="15.5" fill="#f4efe4" text-anchor="middle" font-weight="600">JSObject</text>
    <g font-size="15" fill="#211d19" font-family="Menlo, Consolas, monospace">
      <text x="80" y="205">map</text>
      <text x="80" y="247">properties</text>
      <text x="80" y="289">elements</text>
    </g>
    <g font-size="12.5" fill="#6f675c">
      <text x="284" y="205" text-anchor="end">类型 / 形状</text>
      <text x="284" y="247" text-anchor="end">命名属性入口</text>
      <text x="284" y="289" text-anchor="end">索引元素入口</text>
    </g>
    <line x1="66" y1="216" x2="294" y2="216" stroke="#d8d2c4"/>
    <line x1="66" y1="258" x2="294" y2="258" stroke="#d8d2c4"/>
  </g>

  <!-- 右上：properties store -->
  <g>
    <rect x="520" y="140" width="400" height="96" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="520" y="140" width="400" height="32" fill="#a13c2a"/>
    <text x="720" y="161" font-size="15" fill="#f4efe4" text-anchor="middle" font-weight="600">properties store（命名属性）</text>
    <g font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="612" y="209" text-anchor="middle">"a" → 1</text>
      <text x="768" y="209" text-anchor="middle">"b" → 2</text>
      <text x="886" y="209" text-anchor="middle" fill="#6f675c">…</text>
    </g>
    <line x1="690" y1="172" x2="690" y2="218" stroke="#d8d2c4"/>
    <line x1="846" y1="172" x2="846" y2="218" stroke="#d8d2c4"/>
  </g>

  <!-- 右下：elements store -->
  <g>
    <rect x="520" y="262" width="400" height="94" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="520" y="262" width="400" height="32" fill="#3f6f60"/>
    <text x="720" y="283" font-size="15" fill="#f4efe4" text-anchor="middle" font-weight="600">elements store（整数索引）</text>
    <g font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="588" y="330" text-anchor="middle">[0]</text>
      <text x="716" y="330" text-anchor="middle">[1]</text>
      <text x="844" y="330" text-anchor="middle">[2]</text>
    </g>
    <line x1="652" y1="294" x2="652" y2="338" stroke="#d8d2c4"/>
    <line x1="780" y1="294" x2="780" y2="338" stroke="#d8d2c4"/>
  </g>

  <!-- 箭头 -->
  <path d="M 300 228 C 400 228, 440 192, 516 190" fill="none" stroke="#a13c2a" stroke-width="2" marker-end="url(#arrB)"/>
  <path d="M 300 268 C 400 268, 440 304, 516 308" fill="none" stroke="#3f6f60" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="398" y="216" font-size="13" fill="#a13c2a" font-weight="600">properties 指针</text>
  <text x="398" y="316" font-size="13" fill="#3f6f60" font-weight="600">elements 指针</text>

  <!-- 底注 -->
  <text x="60" y="404" font-size="13.5" fill="#6f675c">分离的目的：索引访问走连续数组路径，命名属性走形状（map）驱动的槽位路径，互不干扰、各自优化。</text>
</svg>
