<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13c2a"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="17" fill="#211d19" font-weight="700">let objs = [{x:1}, {y:2}, arr2]  →  PACKED_ELEMENTS</text>

  <!-- JSArray -->
  <g>
    <rect x="40" y="66" width="260" height="160" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="40" y="66" width="260" height="32" fill="#211d19"/>
    <text x="170" y="87" font-size="15" fill="#f4efe4" text-anchor="middle" font-weight="600">JSArray · 共 16 字节</text>
    <g font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="58" y="144">map</text>
      <text x="58" y="174">properties</text>
      <text x="58" y="204">elements</text>
      <text x="58" y="234">length = 3</text>
    </g>
    <g font-size="12.5" fill="#6f675c" text-anchor="end">
      <text x="284" y="144">4B 压缩指针</text>
      <text x="284" y="174">4B</text>
      <text x="284" y="204">4B</text>
      <text x="284" y="234">4B Smi</text>
    </g>
    <line x1="46" y1="152" x2="294" y2="152" stroke="#d8d2c4"/>
    <line x1="46" y1="182" x2="294" y2="182" stroke="#d8d2c4"/>
    <line x1="46" y1="212" x2="294" y2="212" stroke="#d8d2c4"/>
  </g>

  <!-- elements 指针箭头 -->
  <path d="M 250 210 C 330 200, 350 170, 396 150" fill="none" stroke="#a13c2a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="286" y="166" font-size="12.5" fill="#a13c2a" font-weight="600">elements 指针</text>

  <!-- FixedArray -->
  <g>
    <rect x="400" y="66" width="460" height="464" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="400" y="66" width="460" height="32" fill="#a13c2a"/>
    <text x="630" y="87" font-size="15" fill="#f4efe4" text-anchor="middle" font-weight="600">FixedArray（backing store）</text>
    <g font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="420" y="120">map · 4B</text>
      <text x="420" y="144">length = 3（容量）· 4B</text>
    </g>
    <line x1="406" y1="156" x2="854" y2="156" stroke="#d8d2c4"/>

    <g font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="420" y="185">→ {x:1}</text>
      <text x="420" y="225">→ {y:2}</text>
      <text x="420" y="265">→ arr2</text>
    </g>
    <g font-size="12.5" fill="#6f675c" text-anchor="end">
      <text x="840" y="185">slot[0] · 4 字节 tagged</text>
      <text x="840" y="225">slot[1] · 4 字节 tagged</text>
      <text x="840" y="265">slot[2] · 4 字节 tagged</text>
    </g>
    <line x1="406" y1="200" x2="854" y2="200" stroke="#d8d2c4"/>
    <line x1="406" y1="240" x2="854" y2="240" stroke="#d8d2c4"/>
    <text x="420" y="308" font-size="12.5" fill="#a13c2a">tagged：低位 1 = 压缩指针，GC 扫描并改写</text>
    <text x="420" y="332" font-size="12.5" fill="#a13c2a">低位 0 = Smi——PACKED_SMI 数组共用此仓库，槽里全是 Smi</text>
  </g>
</svg>
