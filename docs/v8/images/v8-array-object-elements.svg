<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13c2a"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#211d19"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="17" fill="#211d19" font-weight="700">let arr = [{x:1}, {y:2}, arr2]  →  PACKED_ELEMENTS</text>

  <!-- JSArray -->
  <g>
    <rect x="60" y="66" width="240" height="170" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="60" y="66" width="240" height="34" fill="#211d19"/>
    <text x="180" y="89" font-size="15.5" fill="#f4efe4" text-anchor="middle" font-weight="600">JSArray（对象头）</text>
    <g font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#211d19">
      <text x="80" y="131">map</text>
      <text x="80" y="167">properties</text>
      <text x="80" y="203">elements</text>
    </g>
    <line x1="66" y1="142" x2="294" y2="142" stroke="#d8d2c4"/>
    <line x1="66" y1="178" x2="294" y2="178" stroke="#d8d2c4"/>
  </g>

  <path d="M 196 196 C 300 196, 340 160, 416 156" fill="none" stroke="#a13c2a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="238" y="152" font-size="13" fill="#a13c2a" font-weight="600">elements 指针</text>

  <!-- FixedArray -->
  <g>
    <rect x="420" y="66" width="380" height="170" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <rect x="420" y="66" width="380" height="34" fill="#3f6f60"/>
    <text x="610" y="89" font-size="15.5" fill="#f4efe4" text-anchor="middle" font-weight="600">FixedArray（backing store）</text>
    <g font-size="14" font-family="Menlo, Consolas, monospace" fill="#6f675c">
      <text x="440" y="126">map · length = 3</text>
    </g>
    <line x1="426" y1="140" x2="794" y2="140" stroke="#d8d2c4"/>
    <g font-size="13.5" font-family="Menlo, Consolas, monospace" fill="#211d19" text-anchor="middle">
      <text x="500" y="176">ref →</text>
      <text x="620" y="176">ref →</text>
      <text x="740" y="176">ref →</text>
    </g>
    <g font-size="11.5" fill="#6f675c" text-anchor="middle">
      <text x="500" y="198">slot[0] · 4 字节</text>
      <text x="620" y="198">slot[1] · 4 字节</text>
      <text x="740" y="198">slot[2] · 4 字节</text>
    </g>
    <line x1="560" y1="148" x2="560" y2="206" stroke="#d8d2c4"/>
    <line x1="680" y1="148" x2="680" y2="206" stroke="#d8d2c4"/>
    <text x="440" y="224" font-size="12.5" fill="#a13c2a">↑ tagged 压缩指针，GC 会扫描并更新</text>
  </g>

  <!-- 指向的对象 -->
  <g>
    <rect x="440" y="290" width="130" height="66" fill="#fbf9f4" stroke="#211d19"/>
    <text x="505" y="318" font-size="14" fill="#211d19" text-anchor="middle" font-family="Menlo, Consolas, monospace">{ x : 1 }</text>
    <text x="505" y="340" font-size="12" fill="#6f675c" text-anchor="middle">堆上的 JSObject</text>

    <rect x="610" y="290" width="130" height="66" fill="#fbf9f4" stroke="#211d19"/>
    <text x="675" y="318" font-size="14" fill="#211d19" text-anchor="middle" font-family="Menlo, Consolas, monospace">{ y : 2 }</text>
    <text x="675" y="340" font-size="12" fill="#6f675c" text-anchor="middle">堆上的 JSObject</text>

    <rect x="780" y="290" width="130" height="66" fill="#fbf9f4" stroke="#211d19"/>
    <text x="845" y="318" font-size="14" fill="#211d19" text-anchor="middle" font-family="Menlo, Consolas, monospace">arr2</text>
    <text x="845" y="340" font-size="12" fill="#6f675c" text-anchor="middle">另一个 JSArray</text>
  </g>
  <path d="M 500 214 L 500 284" fill="none" stroke="#211d19" stroke-width="1.6" marker-end="url(#arrI)"/>
  <path d="M 620 214 L 622 284" fill="none" stroke="#211d19" stroke-width="1.6" marker-end="url(#arrI)"/>
  <path d="M 740 214 L 843 284" fill="none" stroke="#211d19" stroke-width="1.6" marker-end="url(#arrI)"/>

  <!-- 关键差异 -->
  <g font-size="13.5" fill="#211d19">
    <text x="60" y="316">· 槽内存 tagged value：</text>
    <text x="80" y="340">对象 → 压缩指针（低位 1），Smi → 内联整数（低位 0）。</text>
    <text x="60" y="376">· 指针压缩下每槽 4 字节；GC 移动对象时会改写这些槽，指针永远有效。</text>
    <text x="60" y="404">· 利用视角：对象数组和 double 数组互相误读（4 字节指针 ↔ 8 字节 double 的错位拼合），</text>
    <text x="80" y="428">是 addrof / fakeobj 的另一种实现路径 —— 误读一次就同时泄漏地址和伪造对象。</text>
  </g>
</svg>
