<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#211d19"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a13c2a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6f60"/>
    </marker>
  </defs>

  <text x="60" y="34" font-size="17" fill="#211d19" font-weight="700">一个对象的生死与搬家路线</text>

  <!-- new object -->
  <g>
    <rect x="60" y="150" width="130" height="56" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <text x="125" y="174" font-size="14" fill="#211d19" text-anchor="middle">new object</text>
    <text x="125" y="194" font-size="12" fill="#6f675c" text-anchor="middle">{ } 分配</text>
  </g>

  <path d="M 190 178 L 244 178" stroke="#211d19" stroke-width="2" marker-end="url(#arr)"/>

  <!-- New Space -->
  <g>
    <rect x="250" y="112" width="230" height="132" fill="#ffffff" stroke="#3f6f60" stroke-width="1.8"/>
    <text x="365" y="140" font-size="15" fill="#3f6f60" text-anchor="middle" font-weight="700">New Space · From</text>
    <text x="365" y="164" font-size="12.5" fill="#6f675c" text-anchor="middle">Minor GC 触发时清点存活者</text>
    <!-- 两条出路 -->
    <text x="286" y="212" font-size="13.5" fill="#a13c2a">✕ 早死</text>
    <text x="410" y="212" font-size="13.5" fill="#3f6f60">✓ 存活</text>
  </g>

  <!-- 死亡 -->
  <path d="M 300 226 L 300 268" stroke="#a13c2a" stroke-width="2" marker-end="url(#arrR)"/>
  <g>
    <rect x="228" y="274" width="144" height="52" fill="none" stroke="#a13c2a" stroke-dasharray="5 4"/>
    <text x="300" y="296" font-size="13.5" fill="#a13c2a" text-anchor="middle">直接丢弃</text>
    <text x="300" y="314" font-size="12" fill="#6f675c" text-anchor="middle">绝大多数临时对象</text>
  </g>

  <!-- 复制到 To -->
  <path d="M 480 178 L 534 178" stroke="#3f6f60" stroke-width="2" marker-end="url(#arrG)"/>
  <g>
    <rect x="540" y="112" width="170" height="132" fill="#ffffff" stroke="#3f6f60" stroke-width="1.8"/>
    <text x="625" y="140" font-size="15" fill="#3f6f60" text-anchor="middle" font-weight="700">To-Space</text>
    <text x="625" y="164" font-size="12.5" fill="#6f675c" text-anchor="middle">存活者复制到此</text>
    <text x="625" y="212" font-size="13.5" fill="#3f6f60" text-anchor="middle">✓ 再次存活</text>
  </g>
  <text x="508" y="100" font-size="12" fill="#6f675c">指针已被改写 →</text>
  <text x="508" y="118" font-size="12" fill="#6f675c">旧地址作废</text>

  <!-- 晋升 -->
  <path d="M 710 178 L 764 178" stroke="#a13c2a" stroke-width="2" marker-end="url(#arrR)"/>
  <g>
    <rect x="770" y="112" width="150" height="132" fill="#ffffff" stroke="#a13c2a" stroke-width="1.8"/>
    <text x="845" y="140" font-size="15" fill="#a13c2a" text-anchor="middle" font-weight="700">Old Space</text>
    <text x="845" y="164" font-size="12.5" fill="#6f675c" text-anchor="middle">晋升，长期存活</text>
    <text x="845" y="200" font-size="12.5" fill="#6f675c" text-anchor="middle">mark-compact 回收</text>
    <text x="845" y="220" font-size="12.5" fill="#6f675c" text-anchor="middle">地址基本稳定</text>
  </g>

  <!-- 侧路：大对象 -->
  <path d="M 125 206 L 125 306 L 228 306" fill="none" stroke="#211d19" stroke-width="1.8" marker-end="url(#arr)"/>
  <g>
    <rect x="234" y="356" width="230" height="58" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <text x="349" y="380" font-size="14" fill="#211d19" text-anchor="middle">Large Object Space</text>
    <text x="349" y="400" font-size="12" fill="#6f675c" text-anchor="middle">大对象跳过新生代，直接分配</text>
  </g>
  <text x="140" y="290" font-size="12" fill="#6f675c">超过大小阈值</text>

  <!-- 侧路：代码 -->
  <g>
    <rect x="500" y="356" width="210" height="58" fill="#fbf9f4" stroke="#211d19" stroke-width="1.5"/>
    <text x="605" y="380" font-size="14" fill="#211d19" text-anchor="middle">Code Space</text>
    <text x="605" y="400" font-size="12" fill="#6f675c" text-anchor="middle">JIT 代码对象走独立通道</text>
  </g>
  <path d="M 365 244 L 365 356" stroke="#211d19" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="378" y="330" font-size="12" fill="#6f675c">优化代码产生时</text>

  <!-- 底注 -->
  <line x1="60" y1="440" x2="920" y2="440" stroke="#d8d2c4"/>
  <text x="60" y="418" font-size="13.5" fill="#211d19" font-weight="600">利用视角：</text>
  <text x="148" y="418" font-size="13.5" fill="#6f675c">跨 GC 的地址稳定性 = fake object 的地基；晋升与搬移会改写所有引用 —— 但只改「被 GC 认识的」指针。</text>
</svg>
